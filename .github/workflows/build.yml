name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libgtk-3-dev pkg-config

      - name: Build console and GUI (warnings are errors)
        run: make CFLAGS="-Wall -Wextra -Werror -O2"

      - name: Run tests
        run: make test
